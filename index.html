        <h1>MiNominaSV · Calculadora Salarial y Prestaciones Laborales de El Salvador</h1>
        <p>
          MiNominaSV es una plataforma web para el cálculo transparente de nómina, prestaciones de ley y gestión presupuestaria quincenal en El Salvador, conforme a la normativa del Código de Trabajo, la Ley del Seguro Social, la Ley del Sistema de Ahorro para Pensiones (SAP) y las Tablas de Retención del Impuesto sobre la Renta (ISR) del Ministerio de Hacienda.
        </p>

        <section>
          <h2>Deducciones Obligatorias de Ley en El Salvador</h2>
          <ul>
            <li>
              <strong>Instituto Salvadoreño del Seguro Social (ISSS):</strong> Tasa laboral del 3.00% sobre el salario nominal, con un techo máximo de cotización de $1,000.00 mensuales (descuento máximo para el trabajador: $30.00 al mes o $15.00 por quincena).
            </li>
            <li>
              <strong>Administradoras de Fondos de Pensiones (AFP Crecer / Confía):</strong> Aporte obligatorio del trabajador del 7.25% sobre la totalidad de las remuneraciones gravables, sin techo superior de cotización.
            </li>
            <li>
              <strong>Impuesto sobre la Renta (ISR):</strong> Se calcula sobre la renta imponible obtenida tras deducir el ISSS y la AFP del salario nominal, aplicando las escalas progresivas oficiales publicadas por la Dirección General de Impuestos Internos (DGII).
            </li>
          </ul>
        </section>

        <section>
          <h2>Prestaciones Laborales y Cálculos Adicionales</h2>
          <ul>
            <li><strong>Vacación Anual Remunerada:</strong> 15 días continuos de descanso remunerado con una bonificación legal obligatoria del 30% calculada sobre el salario quincenal (Código de Trabajo, Arts. 177 y subsiguientes).</li>
            <li><strong>Aguinaldo de Ley:</strong> Compensación de fin de año según antigüedad laboral (1 a 3 años: 15 días; 3 a 10 años: 19 días; más de 10 años: 21 días de salario).</li>
            <li><strong>Horas Extraordinarias:</strong> Horas extras diurnas (recargo del 100% sobre el valor hora normal) y nocturnas (recargo adicional del 25% por nocturnidad más 100% extraordinario).</li>
            <li><strong>Subsidio de Incapacidad Temporal ISSS:</strong> Cobertura del 75% del salario promedio diario a partir del 4.° día de reposo prescrito, conforme al Reglamento para la Aplicación del Régimen del Seguro Social y el Artículo 53 de la Ley del ISSS.</li>
          </ul>
